[project]
name = "mercurio-finance"
version = "0.1.0"
description = "Workspace Python do Mercúrio: finance-api e ingestion-worker."
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["services"]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]
