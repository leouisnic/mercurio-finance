[project]
name = "finance-api"
version = "0.1.0"
description = "API financeira do Mercúrio: resumo por titularidade, reserva do DAS e conciliação de movimentos."
readme = "README.md"
authors = [
    { name = "Leonardo Colacio Nicolau", email = "colacionicolau@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "ingestion-worker",
    "mercurio-domain",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv.sources]
mercurio-domain = { workspace = true }
ingestion-worker = { workspace = true }
