[project]
name = "ingestion-worker"
version = "0.1.0"
description = "Importadores e ETL do Mercúrio: extratos bancários, planilhas e XML de NFS-e."
readme = "README.md"
authors = [
    { name = "Leonardo Colacio Nicolau", email = "colacionicolau@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mercurio-domain",
    "pandas>=3.0.5",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
mercurio-domain = { workspace = true }
