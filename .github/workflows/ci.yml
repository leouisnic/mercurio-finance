name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mercurio
          POSTGRES_PASSWORD: mercurio
          POSTGRES_DB: mercurio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mercurio -d mercurio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://mercurio:mercurio@localhost:5432/mercurio_ci_unused
      TEST_DATABASE_URL: postgresql+asyncpg://mercurio:mercurio@localhost:5432/mercurio_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Instalar dependências
        run: uv sync --locked --all-packages

      - name: Aplicar migrações em banco vazio
        working-directory: services/finance-api
        env:
          DATABASE_URL: postgresql+asyncpg://mercurio:mercurio@localhost:5432/mercurio_test
        run: uv run alembic upgrade head

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest

  web:
    name: web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mercurio
          POSTGRES_PASSWORD: mercurio
          POSTGRES_DB: mercurio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mercurio -d mercurio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://mercurio:mercurio@localhost:5432/mercurio_ci_unused
      TEST_DATABASE_URL: postgresql+asyncpg://mercurio:mercurio@localhost:5432/mercurio_test
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Instalar uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Instalar workspace Python
        working-directory: ${{ github.workspace }}
        run: uv sync --locked --all-packages

      - name: Aplicar migrações em banco vazio
        working-directory: ${{ github.workspace }}/services/finance-api
        env:
          DATABASE_URL: postgresql+asyncpg://mercurio:mercurio@localhost:5432/mercurio_test
        run: uv run alembic upgrade head

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Vitest
        run: npm run test

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:e2e
